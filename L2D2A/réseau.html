<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Épreuves & Corrections - Réseaux</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bleu:#2071b3;
  --bleu-fonce:#154a79;
  --marron:#8b5a2b;
  --beige:#f5e9d7;
  --texte:#2b2b2b;
}

body{
  font-family:'Inter',sans-serif;
  background:#f2e7d8;
  color:var(--texte);
  padding:20px;
}

/* TITRES */
h1{
  text-align:center;
  color:var(--bleu-fonce);
  margin:20px 0 10px;
  font-size:40px;
}
.intro{
  text-align:center;
  max-width:800px;
  margin:0 auto 40px;
  font-size:18px;
  line-height:1.7;
  color:#444;
}

h2{
  text-align:center;
  color:var(--marron);
  margin:40px 0 20px;
  font-size:32px;
}

/* GRILLE IMAGES */
.grille{
  max-width:1000px;
  margin:0 auto 50px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:25px;
}

.grille img{
  width:100%;
  height:280px;
  object-fit:cover;
  border-radius:16px;
  border:4px solid var(--bleu);
  cursor:pointer;
  transition:.3s ease-in-out;
}
.grille img:hover{
  transform:scale(1.03);
  box-shadow:0 15px 30px rgba(0,0,0,.3);
}

/* MODAL */
#modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  z-index:999;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

#modal-container {
  max-width: 90%;
  max-height: 80vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

#modal img{
  max-width:100%;
  max-height:80vh;
  border-radius:10px;
  transition:transform .2s ease-out;
  object-fit: contain;
}

/* CONTROLES ZOOM */
.zoom-controls{
  position:absolute;
  top:30px;
  right:30px;
  display:flex;
  gap:15px;
}
.btn-retour {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #154a79;
  color: #fff;
  text-decoration: none;
  padding: 10px 20px;
  border-radius: 25px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 600;
  margin: 20px;
  transition: background .25s;
}
.btn-retour:hover { background: #8b5a2b; }
.zoom-controls button{
  width:55px;
  height:55px;
  border:none;
  border-radius:50%;
  font-size:26px;
  font-weight:bold;
  background:var(--bleu);
  color:#fff;
  cursor:pointer;
  display:flex;
  justify-content:center;
  align-items:center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
.zoom-controls button:hover{
  background:var(--bleu-fonce);
}

/* FERMER */
.close-btn{
  position:absolute;
  bottom:30px;
  background:var(--bleu);
  color:#fff;
  border:none;
  padding:14px 40px;
  border-radius:35px;
  font-size:18px;
  cursor:pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
.close-btn:hover{
  background:var(--marron);
}

/* RESPONSIVE */
@media(max-width:600px){
  h1{font-size:30px;}
  h2{font-size:26px;}
  .zoom-controls{top:15px; right:15px;}
  .zoom-controls button{width:45px; height:45px; font-size:20px;}
}
</style>
</head>

<body>
  <a href="principal.html" class="btn-retour">← Retour</a>
<h1>Annales d'Examens</h1>
<p class="intro">
  Cette page regroupe les sujets d’épreuves et leurs corrections.
  Cliquez sur une image pour l’agrandir et zoomer afin de lire clairement le contenu.
</p>

<h2>Épreuves de Réseaux</h2>
<div class="grille">
  <img src="reseauX1.jpeg" alt="Sujet Réseau 1" onclick="ouvrir(this.src)">
  <img src="reseauX2.jpeg" alt="Sujet Réseau 2" onclick="ouvrir(this.src)">
  <img src="reseauX3.jpeg" alt="Sujet Réseau 3" onclick="ouvrir(this.src)">
  <img src="reseauX4.jpeg" alt="Sujet Réseau 4" onclick="ouvrir(this.src)">
  <img src="reseauX5.jpeg" alt="Sujet Réseau 5" onclick="ouvrir(this.src)">
  
  <img src="https://cdn-icons-png.flaticon.com/512/337/337946.png" alt="Télécharger le PDF" onclick="ouvrirPDF('reseau.pdf')">
  <img src="https://cdn-icons-png.flaticon.com/512/337/337946.png" alt="Télécharger le PDF" onclick="ouvrirPDF('Examen_Synthese_Services_Reseaux.pdf')">
</div>

<div id="modal">
  <div id="modal-container">
    <img id="modalImg" alt="Vue agrandie">
  </div>

  <div class="zoom-controls">
    <button onclick="zoomOut()">−</button>
    <button onclick="zoomIn()">+</button>
  </div>

  <button class="close-btn" onclick="fermer()">Fermer ×</button>
</div>

<script>
let scale = 1;

function ouvrir(src){
  const modal = document.getElementById("modal");
  const img = document.getElementById("modalImg");
  img.src = src;
  scale = 1;
  img.style.transform = "scale(1)";
  modal.style.display = "flex";
}

function fermer(){
  document.getElementById("modal").style.display = "none";
}

function zoomIn(){
  scale += 0.2;
  document.getElementById("modalImg").style.transform = "scale(" + scale + ")";
}

function zoomOut(){
  if(scale > 0.6){
    scale -= 0.2;
    document.getElementById("modalImg").style.transform = "scale(" + scale + ")";
  }
}

// Nouvelle fonction pour gérer l'ouverture du fichier PDF généré
function ouvrirPDF(url){
  window.open(url, '_blank');
}
</script>

</body>
</html>
