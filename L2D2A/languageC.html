<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Épreuves & Corrections</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bleu:#2071b3;
  --bleu-fonce:#154a79;
  --marron:#8b5a2b;
  --beige:#f5e9d7;
  --texte:#2b2b2b;
}

body{
  font-family:'Inter',sans-serif;
  background:#f2e7d8;
  color:var(--texte);
  padding:20px;
}

/* TITRES */
h1{
  text-align:center;
  color:var(--bleu-fonce);
  margin:20px 0 10px;
  font-size:40px;
}
.intro{
  text-align:center;
  max-width:800px;
  margin:0 auto 40px;
  font-size:18px;
  line-height:1.7;
  color:#444;
}

h2{
  text-align:center;
  color:var(--marron);
  margin:40px 0 20px;
  font-size:32px;
}

/* GRILLE IMAGES & CARTES */
.grille{
  max-width:900px;
  margin:0 auto 50px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
}

.grille img, .pdf-card {
  width: 100%;
  height: 260px;
  border-radius: 16px;
  border: 4px solid var(--bleu);
  cursor: pointer;
  transition: .3s;
}

.grille img {
  object-fit: cover;
}

/* Style spécifique pour présenter le bouton PDF proprement */
.pdf-card {
  background: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  text-decoration: none;
  color: var(--texte);
}

.pdf-card img {
  width: 80px;
  height: 80px;
  border: none;
  margin-bottom: 15px;
}

.pdf-card span {
  font-weight: 600;
  font-size: 16px;
  color: var(--bleu-fonce);
  text-align: center;
}

.grille img:hover, .pdf-card:hover{
  transform:scale(1.05);
  box-shadow:0 20px 40px rgba(0,0,0,.4);
}

/* MODAL */
#modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  z-index:999;
  justify-content:center;
  align-items:center;
}
.btn-retour {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #154a79;
  color: #fff;
  text-decoration: none;
  padding: 10px 20px;
  border-radius: 25px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 600;
  margin: 20px;
  transition: background .25s;
}
.btn-retour:hover { background: #8b5a2b; }
#modal img{
  max-width:90%;
  max-height:80vh;
  border-radius:20px;
  transition:transform .3s;
}

/* CONTROLES ZOOM */
.zoom-controls{
  position:absolute;
  top:30px;
  right:30px;
  display:flex;
  gap:15px;
}

.zoom-controls button{
  width:55px;
  height:55px;
  border:none;
  border-radius:50%;
  font-size:26px;
  font-weight:bold;
  background:var(--bleu);
  color:#fff;
  cursor:pointer;
}
.zoom-controls button:hover{
  background:var(--bleu-fonce);
}

/* FERMER */
.close-btn{
  position:absolute;
  bottom:30px;
  background:var(--bleu);
  color:#fff;
  border:none;
  padding:14px 40px;
  border-radius:35px;
  font-size:18px;
  cursor:pointer;
}
.close-btn:hover{
  background:var(--marron);
}

/* RESPONSIVE */
@media(max-width:600px){
  h1{font-size:30px;}
  h2{font-size:26px;}
}
</style>
</head>

<body>
  <a href="principal.html" class="btn-retour">← Retour</a>
<h1>Annales d'Examens</h1>
<p class="intro">
  Cette page regroupe les sujets d’épreuves sous forme d'images et de documents.
  Cliquez sur une image pour l’agrandir ou téléchargez directement le recueil au format PDF complet.
</p>

<h2>Épreuves</h2>
<div class="grille">
  
  <!-- Tes images d'épreuves (Exemple) -->
  <img src="languageC.jpeg" onclick="ouvrir(this.src)">
  <img src="LC/lc.jpg" onclick="ouvrir(this.src)">
  <img src="LC/lc (2).jpg" onclick="ouvrir(this.src)">
  <img src="LC/lc (3).jpg" onclick="ouvrir(this.src)">
  <img src="LC/lc (4).jpg" onclick="ouvrir(this.src)">
  <img src="LC/lc (5).jpg" onclick="ouvrir(this.src)">
  <img src="LC/lc (6).jpg" onclick="ouvrir(this.src)">
  <img src="LC/lc (7).jpg" onclick="ouvrir(this.src)">
  <img src="LC/lc (7).jpg" onclick="ouvrir(this.src)">
  <img src="LC/lc (8).jpg" onclick="ouvrir(this.src)">
  <img src="LC/lc (9).jpg" onclick="ouvrir(this.src)">  
  <img src="LC/lc (10).jpg" onclick="ouvrir(this.src)">
  <img src="LC/lc (11).jpg" onclick="ouvrir(this.src)">
  
  <!-- LE BOUTON PDF CORRIGÉ : Il ouvre le fichier dans un nouvel onglet de manière fluide -->
  <a href="language C X.pdf" target="_blank" class="pdf-card">
    <img src="https://cdn-icons-png.flaticon.com/512/337/337946.png" alt="Icone PDF">
    <span>Voir / Télécharger le PDF Complet</span>
  </a>

</div>

<!-- MODAL POUR LES IMAGES -->
<div id="modal">
  <img id="modalImg">

  <div class="zoom-controls">
    <button onclick="zoomOut()">−</button>
    <button onclick="zoomIn()">+</button>
  </div>

  <button class="close-btn" onclick="fermer()">Fermer ×</button>
</div>

<script>
let scale = 1;

function ouvrir(src){
  const modal = document.getElementById("modal");
  const img = document.getElementById("modalImg");
  img.src = src;
  scale = 1;
  img.style.transform = "scale(1)";
  modal.style.display = "flex";
}

function fermer(){
  document.getElementById("modal").style.display = "none";
}

// Molette de zoom pour les images
function zoomIn(){
  scale += 0.2;
  document.getElementById("modalImg").style.transform = "scale(" + scale + ")";
}

function zoomOut(){
  if(scale > 0.6){
    scale -= 0.2;
    document.getElementById("modalImg").style.transform = "scale(" + scale + ")";
  }
}
</script>

</body>
</html>
