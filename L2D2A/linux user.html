
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linux utilisateur</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bleu:#2071b3;
  --bleu-fonce:#154a79;
  --marron:#8b5a2b;
  --texte:#2b2b2b;
}
body{
  font-family:'Inter',sans-serif;
  background:#f2e7d8;
  color:var(--texte);
  padding:20px;
}
.btn-retour{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#154a79;
  color:#fff;
  text-decoration:none;
  padding:10px 20px;
  border-radius:25px;
  font-size:14px;
  font-weight:600;
  margin:20px 0;
  transition:background .25s;
}
.btn-retour:hover{background:#8b5a2b;}
h1{
  text-align:center;
  color:var(--bleu-fonce);
  margin:20px 0 10px;
  font-size:40px;
}
.intro{
  text-align:center;
  max-width:800px;
  margin:0 auto 40px;
  font-size:18px;
  line-height:1.7;
  color:#444;
}
h2{
  text-align:center;
  color:var(--marron);
  margin:40px 0 20px;
  font-size:32px;
}
.grille{
  max-width:900px;
  margin:0 auto 50px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
}
.grille img{
  width:100%;
  height:260px;
  object-fit:contain;
  padding:30px;
  border-radius:16px;
  border:4px solid var(--bleu);
  cursor:pointer;
  transition:.3s;
  background:white;
}
.grille img:hover{
  transform:scale(1.05);
  box-shadow:0 20px 40px rgba(0,0,0,.4);
}
#modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  z-index:999;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}
#modal iframe{
  width:90%;
  height:80vh;
  border:none;
  border-radius:20px;
}
#modalIMG{
  max-width:90%;
  max-height:80vh;
  border-radius:20px;
  transition:transform .2s;
}
.controls{
  position:absolute;
  top:30px;
  right:30px;
  display:flex;
  gap:10px;
}
.controls button{
  padding:10px 16px;
  font-size:20px;
  border:none;
  border-radius:10px;
  background:var(--bleu);
  color:white;
  cursor:pointer;
}
.controls button:hover{background:var(--marron);}
.close-btn{
  position:absolute;
  bottom:30px;
  background:var(--bleu);
  color:#fff;
  border:none;
  padding:14px 40px;
  border-radius:35px;
  font-size:18px;
  cursor:pointer;
}
.close-btn:hover{background:var(--marron);}
@media(max-width:600px){h1{font-size:28px;}h2{font-size:22px;}}
</style>
</head>
<body>

<a href="principal.html" class="btn-retour">← Retour</a>

<h1>Linux utilisateur</h1>
<p class="intro">
  Cette page regroupe les sujets d'épreuves et leurs corrections.
  Cliquez sur l'icône PDF ou l'image pour l'ouvrir.
</p>

<h2>Épreuves</h2>
<div class="grille">
  <img src="https://cdn-icons-png.flaticon.com/512/337/337946.png" alt="PDF" onclick="ouvrirPDF('linux (2).pdf')">
  <img src="https://cdn-icons-png.flaticon.com/512/337/337946.png" alt="PDF" onclick="ouvrirPDF('1_Systeme_Exploitation_Linux.pdf')">
  <img src="linuximage.webp" alt="PDF" onclick="ouvrirPDF('linux/examens linux uadb.pdf')">
  <img src="../srt2/linux (9).jpeg" alt="Sujet Linux" onclick="ouvrirImage(this.src)">
  <img src="../srt2/linux (3).jpeg" alt="Sujet Linux" onclick="ouvrirImage(this.src)">
  <img src="../srt2/linux1.jpeg" alt="Sujet Linux" onclick="ouvrirImage(this.src)">
  <img src="../srt2/linux1 (2).jpeg" alt="Sujet Linux" onclick="ouvrirImage(this.src)">
  <img src="../srt2/linux1 (3).jpeg" alt="Sujet Linux" onclick="ouvrirImage(this.src)">
  <img src="../srt2/linux1 (4).jpeg" alt="Sujet Linux" onclick="ouvrirImage(this.src)">
  <img src="../srt2/linux1 (5).jpeg" alt="Sujet Linux" onclick="ouvrirImage(this.src)">
  <img src="../srt2/linux1 (6).jpeg" alt="Sujet Linux" onclick="ouvrirImage(this.src)">
  <img src="../srt2/linux (1).jpg" alt="Sujet Linux" onclick="ouvrirImage(this.src)">
  <img src="../srt2/linux (2).jpg" alt="Sujet Linux" onclick="ouvrirImage(this.src)">
  <img src="../srt2/linux (2).jpeg" alt="Sujet Linux" onclick="ouvrirImage(this.src)">
  <img src="../srt2/linux (4).jpeg" alt="Sujet Linux" onclick="ouvrirImage(this.src)">
  <img src="../srt2/linux (5).jpeg" alt="Sujet Linux" onclick="ouvrirImage(this.src)">
  <img src="../srt2/linux (6).jpeg" alt="Sujet Linux" onclick="ouvrirImage(this.src)">
  <img src="../srt2/linux (7).jpeg" alt="Sujet Linux" onclick="ouvrirImage(this.src)">
  <img src="../srt2/linux (8).jpeg" alt="Sujet Linux" onclick="ouvrirImage(this.src)">
  <img src="../srt2/linux (1).jpeg" alt="Sujet Linux" onclick="ouvrirImage(this.src)">
  <img src="../srt2/linux (10).jpeg" alt="Sujet Linux" onclick="ouvrirImage(this.src)">
 
</div>

<!-- MODAL -->
<div id="modal">
  <div class="controls">
    <button onclick="zoomPlus()">+</button>
    <button onclick="zoomMoins()">−</button>
  </div>
  <iframe id="modalPDF" style="display:none;"></iframe>
  <img id="modalIMG" style="display:none;">
  <button class="close-btn" onclick="fermer()">Fermer ×</button>
</div>

<script>
let zoom = 1;

function ouvrirPDF(src){
  const modal = document.getElementById("modal");
  const pdf   = document.getElementById("modalPDF");
  const img   = document.getElementById("modalIMG");
  img.style.display = "none";
  pdf.style.display = "block";
  pdf.src = src;
  modal.style.display = "flex";
}

function ouvrirImage(src){
  const modal = document.getElementById("modal");
  const pdf   = document.getElementById("modalPDF");
  const img   = document.getElementById("modalIMG");
  pdf.style.display = "none";
  img.style.display = "block";
  img.src = src;
  img.style.transform = "scale(1)";
  zoom = 1;
  modal.style.display = "flex";
}

function zoomPlus(){
  zoom += 0.2;
  document.getElementById("modalIMG").style.transform = "scale("+zoom+")";
}

function zoomMoins(){
  if(zoom > 0.4) zoom -= 0.2;
  document.getElementById("modalIMG").style.transform = "scale("+zoom+")";
}

function fermer(){
  const pdf = document.getElementById("modalPDF");
  pdf.src = "";
  document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
