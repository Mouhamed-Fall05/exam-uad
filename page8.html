<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="srt.css">
</head>
<body>
    <header class="entete">
   <a href="index.html#dr">
        <button class="fermer"> < ACCEUIL </button>
    </a>
    
    </header>
    <div class="page">
        <div class="LICENCE">
            <button class="li" onclick="location.href='ecoma.html'">LICENCE 1</button>
            <button class="li" onclick="location.href='ecoma2.html'">LICENCE 2</button>
            <button class="li" onclick="location.href='ecoma3.html'">LICENCE 3</button>
        </div>
        <svg class="personnage" viewBox="0 0 200 400">

    <!-- Tête -->
    <circle cx="100" cy="70" r="40" fill="#f1c27d"/>

    <!-- Yeux -->
    <circle cx="85" cy="70" r="5" fill="black"/>
    <circle cx="115" cy="70" r="5" fill="black"/>

    <!-- Bouche -->
    <path d="M85 90 Q100 100 115 90" stroke="black" stroke-width="3" fill="none"/>

    <!-- Costume (veste) -->
    <path d="M60 120 L140 120 L140 220 L60 220 Z" fill="#1b263b"/>

    <!-- Pantalon -->
    <rect x="60" y="220" width="80" height="130" fill="#1b263b"/>

    <!-- Chemise blanche -->
    <polygon points="85,120 115,120 115,180 85,180" fill="white"/>

    <!-- Cravate -->
    <polygon points="100,140 110,180 100,220 90,180" fill="red"/>

    <!-- Bras gauche -->
    <rect class="bras" x="20" y="140" width="25" height="120" rx="10" fill="#1b263b"/>

    <!-- Bras droit -->
    <rect class="bras" x="155" y="140" width="25" height="120" rx="10" fill="#1b263b"/>

    <!-- Pieds -->
    <rect x="70" y="350" width="30" height="20" fill="#333333"/>
    <rect x="100" y="350" width="30" height="20" fill="#333333"/>

</svg>

<script>
const personnage = document.querySelector(".personnage");

personnage.addEventListener("click", () => {
    document.body.style.background = 
    document.body.style.background.includes("cccccc")
    ? "linear-gradient(to bottom, #dfe9f3, #ffffff)"
    : "linear-gradient(to bottom, #e6e6e6, #cccccc)";
});
</script>

    </div>
</body>
</html>
