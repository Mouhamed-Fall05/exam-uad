<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Épreuves & Corrections</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bleu:#2071b3;
  --bleu-fonce:#154a79;
  --marron:#8b5a2b;
  --texte:#2b2b2b;
}

body{
  font-family:'Inter',sans-serif;
  background:#f2e7d8;
  color:var(--texte);
  padding:20px;
}

h1{
  text-align:center;
  color:var(--bleu-fonce);
  margin:20px 0 10px;
  font-size:40px;
}

.intro{
  text-align:center;
  max-width:800px;
  margin:0 auto 40px;
  font-size:18px;
  line-height:1.7;
  color:#444;
}

h2{
  text-align:center;
  color:var(--marron);
  margin:40px 0 20px;
  font-size:32px;
}

.grille{
  max-width:900px;
  margin:0 auto 50px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
}

.grille img{
  width:100%;
  height:260px;
  object-fit:contain;
  padding:30px;
  border-radius:16px;
  border:4px solid var(--bleu);
  cursor:pointer;
  transition:.3s;
  background:white;
}

.grille img:hover{
  transform:scale(1.05);
  box-shadow:0 20px 40px rgba(0,0,0,.4);
}

#modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  z-index:999;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

#modal iframe{
  width:90%;
  height:80vh;
  border:none;
  border-radius:20px;
}

.close-btn{
  position:absolute;
  bottom:30px;
  background:var(--bleu);
  color:#fff;
  border:none;
  padding:14px 40px;
  border-radius:35px;
  font-size:18px;
  cursor:pointer;
}

.close-btn:hover{
  background:var(--marron);
}
</style>
</head>

<body>

<h1>ADmistrateur windowsS</h1>

<p class="intro">
Cette page regroupe les sujets d’épreuves et leurs corrections.
Cliquez sur l’icône PDF pour l’ouvrir.
</p>

<h2>Épreuves</h2>

<div class="grille">

  <!-- PDF -->
  <img src="https://cdn-icons-png.flaticon.com/512/337/337946.png"
       onclick="ouvrirPDF('AdminW.pdf')">

</div>

<!-- MODAL -->
<div id="modal">

  <iframe id="modalPDF"></iframe>

  <button class="close-btn" onclick="fermer()">Fermer ×</button>

</div>

<script>

function ouvrirPDF(src){
  const modal = document.getElementById("modal");
  const pdf = document.getElementById("modalPDF");

  pdf.src = src;
  modal.style.display = "flex";
}

function fermer(){
  document.getElementById("modal").style.display = "none";
}

</script>

</body>
</html>
